<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow // Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="logo-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#4F46E5"/>
                                <stop offset="1" stop-color="#06B6D4"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1>Focus<span>Flow</span></h1>
            </div>
            <p class="subtitle">Efficient Two-Tier Task Management</p>
            <div class="connection-status" id="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Connecting to Server...</span>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Stats Bar -->
            <section class="stats-container">
                <div class="stat-card" id="stat-total">
                    <div class="stat-info">
                        <h3>Total Tasks</h3>
                        <p class="stat-value" id="count-total">0</p>
                    </div>
                    <div class="stat-icon total-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                    </div>
                </div>
                
                <div class="stat-card" id="stat-pending">
                    <div class="stat-info">
                        <h3>Pending</h3>
                        <p class="stat-value" id="count-pending">0</p>
                    </div>
                    <div class="stat-icon pending-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    </div>
                </div>

                <div class="stat-card" id="stat-completed">
                    <div class="stat-info">
                        <h3>Completed</h3>
                        <p class="stat-value" id="count-completed">0</p>
                    </div>
                    <div class="stat-icon completed-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    </div>
                </div>
            </section>

            <!-- Dashboard Grid -->
            <div class="dashboard-grid">
                <!-- Left: Creator Panel -->
                <section class="panel creator-panel">
                    <h2>Create Task</h2>
                    <form id="task-form">
                        <div class="input-group">
                            <label for="task-title">Task Title</label>
                            <input type="text" id="task-title" placeholder="What needs to be done?" required autocomplete="off">
                        </div>
                        
                        <div class="input-group">
                            <label for="task-desc">Description (Optional)</label>
                            <textarea id="task-desc" placeholder="Add some context or details..." rows="3"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary" id="submit-btn">
                            <span>Add Task</span>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                    </form>
                </section>

                <!-- Right: Tasks Panel -->
                <section class="panel tasks-panel">
                    <div class="panel-header">
                        <h2>Your Tasks</h2>
                        <div class="task-filter">
                            <button class="filter-btn active" data-filter="all">All</button>
                            <button class="filter-btn" data-filter="pending">Pending</button>
                            <button class="filter-btn" data-filter="completed">Completed</button>
                        </div>
                    </div>

                    <div class="tasks-wrapper">
                        <!-- Loading State -->
                        <div class="loading-state" id="loading-state">
                            <div class="spinner"></div>
                            <p>Loading tasks from database...</p>
                        </div>

                        <!-- Empty State -->
                        <div class="empty-state hidden" id="empty-state">
                            <div class="empty-icon">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                            </div>
                            <h3>No Tasks Found</h3>
                            <p>Get started by creating a task using the form on the left.</p>
                        </div>

                        <!-- Task List -->
                        <div class="task-list" id="task-list"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
